<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Browser voice to physical Stop verification</title>
<style>body{font:16px system-ui;max-width:1000px;margin:40px auto}table{border-collapse:collapse;width:100%}td,th{padding:8px;border-bottom:1px solid #ddd}pre{white-space:pre-wrap}.bad{color:#b22}</style>
<h1>Speech to simulated physical Stop</h1>
<p>Saved speech only. Actual browser capture, local models, task bus and MuJoCo. No microphone or speaker use.</p>
<p>Turn off Voice and Listen while working in the public app before running.</p>
<button id="run">Run six controlled Stop trials</button><p id="status" role="status">Not started.</p>
<button id="judge">Read independent native verification</button>
<table><thead><tr><th>Clip</th><th>Browser checks</th><th>End to Stop POST</th><th>Settled drift</th><th>Reply pending</th></tr></thead><tbody id="rows"></tbody></table>
<pre id="error"></pre>
<script src="/speech-vad/ort.wasm.min.js"></script><script src="/speech-vad/bundle.min.js"></script>
<script type="module">
import {MicrophoneInput} from '/voice-input.mjs';
import {createSpeechMonitor} from '/speech-detector.mjs';
const status=document.querySelector('#status'),button=document.querySelector('#run');
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const epoch=()=> (performance.timeOrigin+performance.now())/1000;
async function request(route,options={}){
 const response=await fetch(route,options),body=await response.json();
 if(!response.ok)throw Error(JSON.stringify(body));return body;
}
const post=(route,data={})=>request('/api'+route,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
async function save(report){const response=await fetch('/report',{method:'POST',body:JSON.stringify(report)});verify(response.ok,'Report save failed');}
async function waitState(predicate,limit=60000){
 const deadline=performance.now()+limit;
 while(performance.now()<deadline){const value=await request('/api/state');if(predicate(value))return value;await sleep(40);}
 throw Error('Simulator state wait timed out');
}
const verify=(condition,message)=>{if(!condition)throw Error(message);};
document.querySelector('#judge').onclick=async()=>{
 try{
  const judged=await request('/clips/physical-stop-judged.json');document.querySelector('#rows').replaceChildren();
  for(const row of judged.rows){
   const tr=document.createElement('tr');if(!row.passed)tr.className='bad';
   for(const value of [row.id,row.passed?'Native pass':'Failed',row.end_to_native_stop_ms?.toFixed(0)+' ms',
     row.settled_joint_drift_rad.toFixed(6)+' rad',row.verified_pending_generation?'Verified':'No']){
    const td=document.createElement('td');td.textContent=value;tr.append(td);
   }document.querySelector('#rows').append(tr);
  }
  document.querySelector('thead tr th:nth-child(3)').textContent='End to native Stop';
  document.querySelector('thead tr th:nth-child(2)').textContent='Native checks';
  status.textContent=judged.passed?`Independent native/physical verification passed ${judged.rows.length}/${judged.rows.length}. Median ${judged.timing_ms.median.toFixed(0)} ms; sample p95 ${judged.timing_ms.p95.toFixed(0)} ms.`:
    'Native verification failed: '+judged.failures.join('; ');
 }catch(error){document.querySelector('#error').textContent='Native verification unavailable: '+error.message;}
};
button.onclick=async()=>{
 button.disabled=true;const monitor=createSpeechMonitor(),rows=[];
 let mic=null,finished=false;
 try{
  const manifest=await request('/clips/physical-manifest.json'),criteria=manifest.protocol.criteria;
  const initial=await request('/api/native-state');
  verify(initial.backend==='workbench'&&initial.profile==='tools'&&initial.robot_joints?.length===7,'Expected native simulated Panda state');
  await monitor.prepare();
  for(const item of manifest.cases){
   status.textContent='Starting '+item.id+'…';
   await waitState(s=>s.model_status==='ready'&&s.speech_input.status==='ready'&&!s.busy&&!s.interaction?.busy);
   await post('/reset');await waitState(s=>s.phase==='Ready'&&s.last_intent===null);
   const task=(await post('/interact',{message:'Bring me the screwdriver.'})).task_id;
   await waitState(s=>s.phase==='Lifting tool'&&s.objects.screwdriver[2]>criteria.minimum_tool_height_m);
   const firstHeld=await request('/api/native-state');
   const clips=[manifest.question,item],captures=[],recognized=[],errors=[];
   let cursor=0,stopPosted=null,stopDone=null,beforeStop=null,questionStarted=null,questionResolved=null;
   let questionResult=null,dialogue=null,stops=0;
   const element=()=>({textContent:'',hidden:false,disabled:false,setAttribute(){}});
   mic=new MicrophoneInput({button:element(),cancel:element(),note:element(),heard:element(),
    mediaDevices:{getUserMedia:async()=>{
     verify(cursor<clips.length,'Unexpected extra capture');
     const clip=clips[cursor++],pcm=new Float32Array(await (await fetch('/clips/'+clip.file)).arrayBuffer());
     const context=new AudioContext({sampleRate:16000}),destination=context.createMediaStreamDestination();
     const buffer=context.createBuffer(1,pcm.length,16000);buffer.copyToChannel(pcm,0);
     const source=context.createBufferSource();source.buffer=buffer;source.connect(destination);
     const capture={clip,context,source,stream:destination.stream,started:null,started_epoch_s:null};captures.push(capture);
     return capture.stream;
    }},
    monitor:async(stream,detector,onPause,signal,onFailure)=>{
     const capture=captures.find(c=>c.stream===stream);
     const cleanup=await monitor.monitor(stream,detector,onPause,signal,onFailure);
     await capture.context.resume();capture.started=performance.now();capture.started_epoch_s=epoch();
     capture.source.start(capture.context.currentTime);
     return ()=>{cleanup();capture.source.stop();capture.context.close().catch(()=>{});};
    },
    fetchAudio:async(route,options)=>{
     const response=await fetch(route,options);if(response.ok)recognized.push(await response.clone().json());return response;
    },
    stopSpeech:async()=>{},onText:()=>{throw Error('Unexpected idle request');},
    onDuringWork:text=>{
     verify(!dialogue,'Unexpected extra dialogue');questionStarted=epoch();
     dialogue=post('/interact',{message:text,source:'voice'}).then(value=>{questionResolved=epoch();questionResult=value;return value;});
     return dialogue;
    },
    onStop:async()=>{
     beforeStop=await request('/api/native-state');verify(beforeStop.busy,'Stop was not during active native motion');
     stopPosted=epoch();stops++;await post('/stop');stopDone=epoch();
    },
    onError:message=>{if(message)errors.push(message);},
   });
   status.textContent='Carrying screwdriver; playing question and '+item.id+'…';
   mic.setReady(true);mic.setWorking(true);
   const deadline=performance.now()+20000;
   while(performance.now()<deadline&&!stopDone&&!errors.length){
    const state=await request('/api/state');mic.setReady(state.speech_input.status==='ready'&&!state.speech_input.busy);
    mic.setWorking(state.busy);await sleep(40);
   }
   verify(stops===1&&stopDone&&errors.length===0,'Spoken Stop failed: '+JSON.stringify(errors));
   const stopped=await waitState(s=>!s.busy&&s.phase==='Stopped');mic.setWorking(false);mic.close();mic=null;
   const physical=await request('/api/native-state');
   await sleep(criteria.settling_observation_ms);const laterPhysical=await request('/api/native-state'),later=await request('/api/state');
   await dialogue;
   const drift=Math.max(...physical.robot_joints.map((q,i)=>Math.abs(q-laterPhysical.robot_joints[i])));
   const motion=Math.max(...firstHeld.robot_joints.map((q,i)=>Math.abs(q-beforeStop.robot_joints[i])));
   const pending=questionStarted!==null&&questionResolved>stopPosted;
   const tracksEnded=captures.every(c=>c.stream.getTracks().every(track=>track.readyState==='ended'));
   const stopCapture=captures[1];verify(stopCapture?.clip.id===item.id,'Stop source identity mismatch');
   const reference=stopCapture.started_epoch_s+item.last_clean_voiced_ms/1000;
   const row={id:item.id,task_id:task,passed:false,recognized,errors,captures:captures.map(c=>({file:c.clip.file,started_epoch_s:c.started_epoch_s,tracks_ended:c.stream.getTracks().every(t=>t.readyState==='ended')})),
    reference_last_voiced_epoch_s:reference,stop_post_epoch_s:stopPosted,stop_done_epoch_s:stopDone,end_to_stop_post_ms:(stopPosted-reference)*1000,
    question_started_epoch_s:questionStarted,question_resolved_epoch_s:questionResolved,question_result:questionResult,pending_reply:pending,
    pre_stop_joint_motion_rad:motion,settled_joint_drift_rad:drift,tracks_ended:tracksEnded,
    first_held:firstHeld,before_stop:beforeStop,after_stop:physical,after_settling:laterPhysical,
    task_status:later.tasks.find(t=>t.task_id===task)?.status,remaining_work:later.tasks.filter(t=>t.status==='pending'||t.status==='running'),stopped_phase:stopped.phase};
   rows.push(row);
   verify(row.task_status==='cancelled'&&row.remaining_work.length===0,'Task cancellation/queue failed');
   verify(drift<criteria.maximum_settled_joint_drift_rad,'Arm did not settle');
   verify(motion>criteria.minimum_pre_stop_joint_motion_rad,'No native motion demonstrated before Stop');
   verify(physical.gripper_command===beforeStop.gripper_command&&laterPhysical.gripper_command===physical.gripper_command,'Gripper command changed during Stop');
   verify(physical.objects.screwdriver[2]>criteria.minimum_tool_height_m&&laterPhysical.objects.screwdriver[2]>criteria.minimum_tool_height_m,'Elevated tool dropped');
   verify(tracksEnded,'Capture track remained live');
   verify(!pending||(questionResult?.mode==='superseded'&&questionResult?.accepted===false),'Pending dialogue was not superseded');
   row.passed=true;
   const tr=document.createElement('tr');for(const value of [item.id,'Pass',row.end_to_stop_post_ms.toFixed(0)+' ms',drift.toFixed(6)+' rad',pending?'Yes':'No']){const td=document.createElement('td');td.textContent=value;tr.append(td);}document.querySelector('#rows').append(tr);
  }
  const report={kind:'physical-stop',scope:manifest.protocol.scope,protocol_sha256:manifest.protocol_sha256,endpoint_protocol_sha256:manifest.endpoint_protocol_sha256,
    rows,count:rows.length,verified_pending_reply_interruptions:rows.filter(r=>r.pending_reply).length,browser_checks_passed:true,native_timing_judge:'Pending independent event-log verification'};
  verify(report.verified_pending_reply_interruptions>=criteria.minimum_verified_pending_reply_interruptions,'Pending inference was never exercised');
  await save(report);
  await post('/reset');await waitState(s=>s.phase==='Ready');
  finished=true;status.textContent=`Finished ${rows.length}/${manifest.cases.length}. Native timing still requires independent event-log verification.`;
 }catch(error){
  document.querySelector('#error').textContent=error.message;status.textContent='Failed; no completion claim.';
  await save({kind:'physical-stop',failed:true,error:error.message,rows}).catch(()=>{});
 }finally{
  mic?.close();if(!finished)await post('/stop').catch(()=>{});await monitor.close().catch(()=>{});
 }
};
</script></html>
