<!doctype html>
<meta charset="utf-8">
<title>Local pretrained speech detector evaluation</title>
<style>body{font:16px system-ui;max-width:1000px;margin:40px auto}table{border-collapse:collapse;width:100%}td,th{padding:5px;border-bottom:1px solid #ddd}.fail{color:#b22}</style>
<h1>Silero speech completion comparison</h1>
<p>Frozen saved audio with synthetic noise. No microphone, transcription or robot commands.</p>
<button id="run">Run fixed cases</button><p id="status">Ready to load local model.</p>
<button id="stream">Run real-time stream checks (no microphone)</button><p id="stream-status">Not started.</p>
<button id="asr-stream">Run stream checks with local Whisper</button><p id="asr-stream-status">No model requests yet.</p>
<table><thead><tr><th>Case</th><th>Passed</th><th>Completion after clean voice</th></tr></thead><tbody id="rows"></tbody></table>
<script src="/ort/ort.wasm.min.js"></script>
<script src="/vad/bundle.min.js"></script>
<script type="module">
import {PauseDetector} from '/voice-input.mjs';
import {MicrophoneInput} from '/voice-input.mjs';
import {createSpeechMonitor} from '/speech-detector.mjs';
const status=document.querySelector('#status'),button=document.querySelector('#run');
button.onclick=async()=>{
 button.disabled=true;
 try{
  status.textContent='Loading pretrained Silero v5 locally…';
  const start=performance.now();
  const engine=await vad.MicVAD.new({model:'v5',startOnLoad:false,baseAssetPath:'/vad/',onnxWASMBasePath:'/ort/',
    ortConfig:ort=>{ort.env.wasm.numThreads=1;ort.env.logLevel='error';},
    getStream:()=>{throw Error('No microphone allowed in this evaluation');}});
  const load_ms=performance.now()-start;
  const manifest=await (await fetch('/clips/manifest.json')).json(),rows=[],frame_ms=[];
  for(const item of manifest.cases){
   engine.model.reset_state();
   const pcm=new Float32Array(await (await fetch('/clips/'+item.file)).arrayBuffer());
   const gate=new PauseDetector({pauseMs:item.pause_ms});let completed=null;
   for(let offset=0;offset+512<=pcm.length;offset+=512){
    const t=performance.now();const probs=await engine.model.process(pcm.slice(offset,offset+512));frame_ms.push(performance.now()-t);
    if(gate.sampleProbability(probs.isSpeech,(offset+512)/16)){completed=(offset+512)/16;break;}
   }
   const forced=completed===null&&gate.heardSpeech;
   const premature=item.expected_speech&&completed!==null&&completed<item.last_clean_voiced_ms-40;
   const passed=item.expected_speech?completed!==null&&!premature:completed===null&&!forced;
   const row={id:item.id,expected_speech:item.expected_speech,completed_ms:completed,forced_submit_at_limit:forced,premature,passed,
     completion_after_clean_voice_ms:completed===null||item.last_clean_voiced_ms===null?null:completed-item.last_clean_voiced_ms};rows.push(row);
   const tr=document.createElement('tr');if(!passed)tr.className='fail';
   for(const value of [row.id,passed?'Yes':'No',row.completion_after_clean_voice_ms===null?'—':row.completion_after_clean_voice_ms+' ms']){
    const td=document.createElement('td');td.textContent=value;tr.append(td);
   }document.querySelector('#rows').append(tr);status.textContent=`Completed ${rows.length}/${manifest.cases.length}`;
  }
  // Upstream destroy() requires started audio nodes. This probe never starts them.
  await engine.model.release();frame_ms.sort((a,b)=>a-b);
  const report={scope:'Actual browser WASM Silero v5 probabilities + shipped pause gate, saved PCM in virtual time. No microphone, ASR or motion.',
   protocol_sha256:manifest.protocol_sha256,model:'Silero v5 from @ricky0123/vad-web 0.0.31',ort:'onnxruntime-web 1.22.0',threshold:.3,
   load_ms,frame_inference_ms:{count:frame_ms.length,median:frame_ms[Math.floor(frame_ms.length*.5)],p95:frame_ms[Math.floor(frame_ms.length*.95)],max:frame_ms.at(-1)},
   rows,count:rows.length,failures:rows.filter(r=>!r.passed).length,
   noise_only_false_submissions:rows.filter(r=>!r.expected_speech&&(r.completed_ms!==null||r.forced_submit_at_limit)).length};
  const response=await fetch('/report',{method:'POST',body:JSON.stringify(report)});if(!response.ok)throw Error('Report save failed');
  status.textContent=`Finished: ${report.count-report.failures}/${report.count} passed; ${report.noise_only_false_submissions} noise-only submissions. Model loaded in ${load_ms.toFixed(0)} ms; frame p95 ${report.frame_inference_ms.p95.toFixed(2)} ms.`;
 }catch(e){status.textContent='Failed: '+e.message;button.disabled=false;}
};
async function streamChecks(useASR=false){
 const name=useASR?'asr-stream':'stream';
 const status=document.querySelector('#'+name+'-status');document.querySelector('#'+name).disabled=true;
 const monitor=createSpeechMonitor();const rows=[];
 try{
  await monitor.prepare();const manifest=await (await fetch('/clips/manifest.json')).json();
  const selected=manifest.stream_cases||['screwdriver-gain0.2-white','negative-gain1-hum','stop-gain0.2-white','stop-gain1-hum','control-white-0.012'];
  for(const id of selected){
   status.textContent='Streaming '+id+'…';const item=manifest.cases.find(x=>x.id===id);
   const pcm=new Float32Array(await(await fetch('/clips/'+item.file)).arrayBuffer());
   const context=new AudioContext({sampleRate:16000}),destination=context.createMediaStreamDestination();
   const buffer=context.createBuffer(1,pcm.length,16000);buffer.copyToChannel(pcm,0);
   const source=context.createBufferSource();source.buffer=buffer;source.connect(destination);
   const element=()=>({textContent:'',hidden:false,disabled:false,setAttribute(){}});
   let completed=null,submissions=0,stopCalls=0,error=null,started,recognized=null,asrResult=null;
   const done=()=>{completed=performance.now()-started;};
   const mic=new MicrophoneInput({button:element(),cancel:element(),note:element(),heard:element(),
    mediaDevices:{getUserMedia:async()=>destination.stream},monitor:monitor.monitor,
    fetchAudio:async(...args)=>{submissions++;if(!useASR)return {ok:true,json:async()=>({text:id.startsWith('stop')?'Stop.':'Test request.'})};
      const response=await fetch(...args);if(response.ok)asrResult=await response.clone().json();return response;},
    onText:async text=>{recognized=text;done();},onDuringWork:async text=>{recognized=text;done();},
    onStop:async()=>{stopCalls++;done();},onError:message=>{error=message;},stopSpeech:async()=>{}});
   mic.setReady(true);await mic.start(item.voice_mode||(id.startsWith('stop')?'interrupt':'request'));
   await context.resume();started=performance.now();source.start(context.currentTime);
   const deadline=started+13000;while(completed===null&&performance.now()<deadline&&!error)await new Promise(r=>setTimeout(r,25));
   const captureMetrics=mic.captureMetrics;
   mic.close();source.stop();await context.close();
   const premature=item.expected_speech&&completed!==null&&completed<item.last_clean_voiced_ms-40;
   const expectedSilence=!item.expected_speech&&error==='No speech heard. Check your microphone and try again.';
   const recognizedCorrectly=!useASR||!item.expected_speech||(
     (item.expected_text?new RegExp(item.expected_text,'i').test(asrResult?.text||recognized||''):
      id.startsWith('stop')?true:id.startsWith('screwdriver')?/screwdriver/i.test(recognized||''):
      /\b(?:don.t|do not)\b/i.test(recognized||''))&&stopCalls===(id.startsWith('stop')?1:0));
   const passed=(!error||expectedSilence)&&recognizedCorrectly&&(item.expected_speech?submissions===1&&completed!==null&&!premature:submissions===0);
   rows.push({id,passed,error,submissions,recognized,recognized_correctly:recognizedCorrectly,stop_calls:stopCalls,completed_ms:completed,premature,capture_metrics:captureMetrics,asr_result:asrResult,
     completion_after_clean_voice_ms:completed===null||item.last_clean_voiced_ms===null?null:completed-item.last_clean_voiced_ms});
  }
  await monitor.close();
  const report={kind:useASR?'asr-stream':'stream',scope:`Actual browser AudioBuffer -> MediaStream -> shipped recorder and Silero AudioWorklet. ${useASR?'Actual local Whisper':'Mock ASR'}; no microphone, speakers or robot commands.`,
    protocol_sha256:manifest.protocol_sha256,rows,count:rows.length,failures:rows.filter(r=>!r.passed).length};
  const response=await fetch('/report',{method:'POST',body:JSON.stringify(report)});if(!response.ok)throw Error('Save failed');
  status.textContent=`Stream checks finished: ${report.count-report.failures}/${report.count} passed; noise-only submissions ${rows.at(-1).submissions}.`;
 }catch(e){status.textContent='Stream checks failed: '+e.message;await monitor.close().catch(()=>{});}
}
document.querySelector('#stream').onclick=()=>streamChecks();
document.querySelector('#asr-stream').onclick=()=>streamChecks(true);
</script>
