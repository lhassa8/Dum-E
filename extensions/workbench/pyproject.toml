[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "dume-workbench"
version = "0.1.0"
description = "Local voice and MuJoCo tool-delivery extension for Dum-E"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "mujoco>=3.3,<4", "numpy>=2,<3", "pillow>=11,<13",
  "fastapi>=0.143.0", "uvicorn>=0.54.0", "httpx>=0.28,<1", "fastmcp>=2.14.5,<3",
  "mlx-lm>=0.32.0; platform_machine == 'arm64' and sys_platform == 'darwin'",
  "mlx-whisper>=0.4,<0.5; platform_machine == 'arm64' and sys_platform == 'darwin'",
  "faster-whisper>=1.2,<2; sys_platform != 'darwin'",
  "imageio-ffmpeg>=0.6,<0.7; sys_platform != 'darwin'",
]

[project.scripts]
dume-sim = "physical_ai_lab.dume.app:main"
workbench = "physical_ai_lab.assistant.app:main"

[project.optional-dependencies]
asr-cuda = ["nvidia-cublas-cu12>=12.8,<13", "nvidia-cudnn-cu12>=9.8,<10"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/physical_ai_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
